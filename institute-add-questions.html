<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Institute – Add Questions</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">TestSeries | Institute</div>
  <nav>
    <a href="institute-dashboard.html">Dashboard</a>
    <a href="institute-add-questions.html" class="active">Add Questions</a>
    <a href="login.html" onclick="logout()">Logout</a>
  </nav>
</header>

<section class="container">
  <h2>Add Questions</h2>

  <div class="card form-card">

    <select id="examType">
      <option value="">Select Exam</option>
      <option value="JEE Main">JEE Main</option>
      <option value="JEE Advanced">JEE Advanced</option>
      <option value="NEET">NEET</option>
    </select>

    <input type="text" id="subject" placeholder="Subject (Physics / Chemistry / Maths / Biology)">

    <textarea id="question" placeholder="Enter Question"></textarea>

    <input type="text" id="optA" placeholder="Option A">
    <input type="text" id="optB" placeholder="Option B">
    <input type="text" id="optC" placeholder="Option C">
    <input type="text" id="optD" placeholder="Option D">

    <select id="correct">
      <option value="">Correct Answer</option>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
    </select>

    <button onclick="addQuestion()">Add Question</button>

  </div>

  <h3>Your Questions</h3>
  <div id="questionList"></div>

</section>

<footer>
  <p>© 2026 TestSeries Platform</p>
</footer>


<script src="config.js"></script>
<script src="script.js"></script>
<script>
loadInstituteQuestions();
</script>

</body>
</html>
