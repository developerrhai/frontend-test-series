<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Result</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">TestSeries</div>
</header>

<div class="card">
  <h2>Exam Result</h2>
  <h3 id="score"></h3>
  <a href="student-dashboard.html">Back to Dashboard</a>
</div>
<h2>Result</h2>
<div id="result"></div>

<script>
let exam = JSON.parse(localStorage.getItem("activeExam"));
let answers = JSON.parse(localStorage.getItem("answers"));
let score = 0;

exam.questions.forEach((q,i)=>{
  if(answers[i] === q.answer) score++;
});

let percent = (score / exam.questions.length) * 100;

document.getElementById("result").innerHTML = `
Score: ${score}/${exam.questions.length}<br>
Percentage: ${percent.toFixed(2)}%
`;
</script>

<footer>
  <p>© 2026 TestSeries Platform</p>
</footer>

<script src="script.js"></script>
<script>
displayResult();
</script>
</body>
</html>
