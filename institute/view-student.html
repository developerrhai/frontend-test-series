<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Intel | TestSeries Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --electric-blue: #0066FF; --midnight: #0A0E27; --cyber-cyan: #00F5FF; 
            --neon-green: #00FF88; --light-bg: #f4f7fe; --silver: #64748b; 
        }

        body { font-family: 'Sora', sans-serif; background: var(--light-bg); padding-top: 100px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 30px 100px; }

        .intel-header {
            background: var(--midnight); color: #fff; padding: 40px; border-radius: 30px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 20px 40px rgba(10, 14, 39, 0.15); margin-bottom: 30px;
        }
        .st-name { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin: 0; }
        .st-meta { font-family: 'Space Mono'; font-size: 12px; color: var(--cyber-cyan); margin-top: 5px; text-transform: uppercase; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: #fff; padding: 25px; border-radius: 20px; border: 1px solid #e2e8f0;
            text-align: center; transition: 0.3s;
        }
        .stat-val { display: block; font-size: 24px; font-weight: 800; color: var(--midnight); margin-bottom: 5px; }
        .stat-lbl { font-family: 'Space Mono'; font-size: 10px; color: var(--silver); text-transform: uppercase; font-weight: 700; }

        .chart-card {
            background: #fff; padding: 30px; border-radius: 24px; border: 1px solid #e2e8f0;
            margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }

        .history-card { background: #fff; border-radius: 24px; border: 1px solid #e2e8f0; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 15px 25px; font-family: 'Space Mono'; font-size: 11px; color: var(--electric-blue); border-bottom: 2px solid #e2e8f0; }
        td { padding: 18px 25px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: var(--midnight); }
        
        .score-badge { 
            padding: 5px 12px; border-radius: 8px; font-weight: 800; font-family: 'Space Mono'; font-size: 12px; 
            background: #f0f7ff; color: var(--electric-blue);
        }

        .back-link { 
            text-decoration: none; color: var(--silver); font-family: 'Space Mono'; 
            font-size: 12px; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; transition: 0.3s;
        }
        .back-link:hover { color: var(--electric-blue); transform: translateX(-5px); }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<main class="container">
    <a href="students-list.html" class="back-link">
        <i class="fas fa-arrow-left"></i> BACK_TO_ROSTER
    </a>

    <div id="profileArea">
        <div class="intel-header">
            <div>
                <h1 class="st-name" id="stName">---</h1>
                <div class="st-meta">Neural Signature: <span id="stId">#---</span> | <span id="stEmail">---</span></div>
            </div>
            <div style="text-align: right;">
                <div style="font-family: 'Space Mono'; font-size: 11px; opacity: 0.6;">INSTITUTION</div>
                <div style="font-weight: 800; font-size: 16px;" id="stCollege">---</div>
            </div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><span class="stat-val" id="statTests">0</span><span class="stat-lbl">Tests Evaluated</span></div>
        <div class="stat-card"><span class="stat-val" id="statAvg">0%</span><span class="stat-lbl">Global Average</span></div>
        <div class="stat-card"><span class="stat-val" id="statRank">#--</span><span class="stat-lbl">Institute Rank</span></div>
        <div class="stat-card"><span class="stat-val" id="statAccuracy">0%</span><span class="stat-lbl">Precision Rate</span></div>
    </div>

    <div class="chart-card">
        <h4 style="margin-top: 0; margin-bottom: 20px; font-weight: 800;">Performance Trajectory</h4>
        <canvas id="performanceChart" height="100"></canvas>
    </div>

    <div class="history-card">
        <table>
            <thead>
                <tr>
                    <th>Test Module</th>
                    <th>Date Attempted</th>
                    <th>Intelligence score</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                </tbody>
        </table>
    </div>
</main>

<div id="footer-placeholder"></div>

<script src="layout.js"></script>

<script>
    // STANDALONE CONFIG: NO CONFIG.JS REQUIRED
    const BASE_URL = ""; // Change to your API domain if necessary
    const token = localStorage.getItem("token");
    const params = new URLSearchParams(window.location.search);
    const studentId = params.get("id");

    if (!token || !studentId) location.href = "student-directory.html";

    async function loadIntel() {
        try {
            // Direct fetch call without getUrl
            const res = await fetch(BASE_URL + `/api/teacher/student-intel/${studentId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();

            if (data.success) {
                const s = data.student;
                document.getElementById("stName").innerText = s.full_name;
                document.getElementById("stId").innerText = "#" + s.id;
                document.getElementById("stEmail").innerText = s.email;
                document.getElementById("stCollege").innerText = s.college_name || "Self-Enrolled";

                document.getElementById("statTests").innerText = data.stats.totalTests;
                document.getElementById("statAvg").innerText = data.stats.avgScore + "%";
                document.getElementById("statRank").innerText = "#" + (data.stats.rank || "N/A");
                document.getElementById("statAccuracy").innerText = data.stats.accuracy + "%";

                renderHistory(data.history);
                renderChart(data.history);
            }
        } catch (err) { console.error("Intel fetch failed."); }
    }

    function renderHistory(history) {
        const body = document.getElementById("historyBody");
        if (!history || history.length === 0) {
            body.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--silver);">No test protocols detected.</td></tr>`;
            return;
        }

        body.innerHTML = history.map(h => `
            <tr>
                <td style="font-weight: 700;">${h.test_name}</td>
                <td style="color: var(--silver); font-family: 'Space Mono'; font-size: 12px;">
                    ${new Date(h.attempt_date).toLocaleDateString()}
                </td>
                <td><span class="score-badge">${h.score}/${h.total_marks}</span></td>
                <td>
                    <span style="color: ${h.score >= (h.total_marks*0.4) ? '#059669' : '#e11d48'}; font-weight: 800;">
                        ${h.score >= (h.total_marks*0.4) ? 'CERTIFIED' : 'FAILED'}
                    </span>
                </td>
            </tr>
        `).join('');
    }

    function renderChart(history) {
        const ctx = document.getElementById('performanceChart').getContext('2d');
        const labels = history.map(h => h.test_name).reverse();
        const scores = history.map(h => (h.score / h.total_marks) * 100).reverse();

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Score Percentage',
                    data: scores,
                    borderColor: '#0066FF',
                    backgroundColor: 'rgba(0, 102, 255, 0.05)',
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#0066FF',
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, max: 100, ticks: { font: { family: 'Space Mono', size: 10 } } },
                    x: { ticks: { font: { family: 'Space Mono', size: 10 } } }
                }
            }
        });
    }

    window.onload = loadIntel;
</script>
</body>
</html>
