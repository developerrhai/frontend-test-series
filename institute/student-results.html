<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Analytics | TestSeries Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .dashboard-wrapper {
            padding: 40px 0 120px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Individual Exam Result Card --- */
        .analytics-card {
            background: #fff;
            padding: 35px;
            border-radius: 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .analytics-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 25px;
            margin-bottom: 25px;
        }

        .exam-title-box h3 {
            font-size: 24px;
            font-weight: 800;
            color: #1e3a8a;
            margin: 0;
        }

        .exam-meta-info {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--silver);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            display: flex;
            gap: 15px;
        }

        /* --- Elite Intelligence Table --- */
        .intel-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        .intel-table th {
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            color: var(--electric-blue);
            letter-spacing: 1.5px;
            padding: 10px 20px;
            text-align: left;
        }

        .intel-table tr td {
            background: #f8fafc;
            padding: 18px 20px;
            font-size: 14px;
            color: #1e293b;
            transition: 0.3s;
        }

        .intel-table tr td:first-child { border-radius: 12px 0 0 12px; border-left: 1px solid #e2e8f0; }
        .intel-table tr td:last-child { border-radius: 0 12px 12px 0; border-right: 1px solid #e2e8f0; }
        .intel-table tr:hover td { background: #f1f5f9; transform: scale(1.01); }

        /* --- Status & AI Badges --- */
        .status-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            background: #dcfce7;
            color: #166534;
        }

        .ai-insight {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .ai-needs-foundation { background: #fff1f2; color: #e11d48; border: 1px solid #fecaca; }
        .ai-practice-accuracy { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
        .ai-excellent { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

        .score-box { font-weight: 800; color: #1e3a8a; }
        .percent-box { font-family: var(--font-mono); font-weight: 700; }

        @media (max-width: 768px) {
            .analytics-header { flex-direction: column; gap: 15px; }
            .intel-table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>

<main class="dashboard-wrapper">
    <div id="content">
        <div style="text-align: center; padding: 100px;">
            <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--electric-blue);"></i>
            <p style="font-family: var(--font-mono); margin-top: 20px; color: var(--silver);">PROCESSING NEURAL DATASTREAMS...</p>
        </div>
    </div>
</main>


<script src="../config.js"></script>
<script src="layout.js"></script>

<script>
const token = localStorage.getItem("token");
const content = document.getElementById("content");

async function init() {
    if (!token) { location.href = "../login.html"; return; }
    renderAllResults();
}

async function renderAllResults() {
    try {
        const examRes = await fetch('/api/teacher/my-tests', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const examData = await examRes.json();
        if (!examData.success) throw new Error(examData.message);

        let finalHtml = `
            <div style="margin-bottom: 40px; border-left: 5px solid var(--electric-blue); padding-left: 20px;">
                <h2 style="font-weight: 800; color: #1e3a8a; margin: 0; font-size: 32px;">Intelligence Analytics</h2>
                <p style="font-family: var(--font-mono); font-size: 12px; color: var(--silver); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 5px;">Comprehensive Performance Deployment History</p>
            </div>
        `;

        for (const exam of examData.tests) {
            const resultRes = await fetch(`/api/teacher/leaderboard/${exam.id}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const resultData = await resultRes.json();

            finalHtml += `
            <div class="analytics-card">
                <div class="analytics-header">
                    <div class="exam-title-box">
                        <h3>${exam.title}</h3>
                        <div class="exam-meta-info">
                            <span><i class="fas fa-microscope"></i> ${exam.subject_type || 'General'}</span>
                            <span><i class="fas fa-fingerprint"></i> ID: ${exam.id}</span>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <span style="font-family: var(--font-mono); font-size: 10px; background: #f1f5f9; padding: 5px 12px; border-radius: 6px; font-weight: 700;">
                            TOTAL MODULE MARKS: ${(exam.question_count || 0) * 4}
                        </span>
                    </div>
                </div>

                <table class="intel-table">
                    <thead>
                        <tr>
                            <th>Student Identification</th>
                            <th>Uplink Status</th>
                            <th>Net Score</th>
                            <th>Accuracy %</th>
                            <th>AI Insight Protocol</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            if (!resultData.leaderboard || resultData.leaderboard.length === 0) {
                finalHtml += `<tr><td colspan="5" style="text-align:center; padding:50px; opacity:0.5; font-family:var(--font-mono);">No student uplink detected for this module.</td></tr>`;
            } else {
                resultData.leaderboard.forEach(r => {
                    const totalPossible = r.total_marks || (exam.question_count * 4) || 100;
                    const percent = ((r.score / totalPossible) * 100).toFixed(1);
                    
                    let aiClass = "ai-excellent";
                    let aiReport = "Excellent Proficiency";
                    
                    if (percent < 45) {
                        aiClass = "ai-needs-foundation";
                        aiReport = "Needs Foundation";
                    } else if (percent < 75) {
                        aiClass = "ai-practice-accuracy";
                        aiReport = "Practice Accuracy";
                    }

                    const percentColor = percent < 45 ? "#ef4444" : percent < 75 ? "#f59e0b" : "#10b981";

                    finalHtml += `
                    <tr>
                        <td>
                            <div style="font-weight:800; color: #1e293b;">${r.full_name}</div>
                            <div style="font-family: var(--font-mono); font-size:11px; color:#64748b; margin-top:2px;">${r.email}</div>
                        </td>
                        <td><span class="status-badge"><i class="fas fa-check"></i> ATTENDED</span></td>
                        <td><span class="score-box">${r.score}</span> <small style="color:#94a3b8;">/ ${totalPossible}</small></td>
                        <td><span class="percent-box" style="color:${percentColor}">${percent}%</span></td>
                        <td><span class="ai-insight ${aiClass}">${aiReport}</span></td>
                    </tr>`;
                });
            }

            finalHtml += `</tbody></table></div>`;
        }

        content.innerHTML = finalHtml;

    } catch (err) {
        content.innerHTML = `
            <div class="analytics-card" style="text-align:center; padding:80px; border-top: 6px solid #ef4444;">
                <i class="fas fa-exclamation-triangle fa-4x" style="color:#ef4444; margin-bottom:25px;"></i>
                <h2 style="font-weight: 800;">Neural Synchronisation Error</h2>
                <p style="color:var(--silver); margin-bottom: 30px;">The database uplink could not be established. Ensure your ResultModel contains the leaderboard protocol.</p>
                <button class="sync-btn" onclick="renderAllResults()" style="padding: 15px 40px;">Retry Uplink</button>
            </div>`;
    }
}

function logout() { localStorage.clear(); location.href = "../login.html"; }

init();
</script>

</body>
</html>
