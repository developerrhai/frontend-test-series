<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank Explorer | Elite Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="../config.js"></script>

    <style>
        :root { 
            --electric-blue: #0066FF; --midnight: #0A0E27; --cyber-cyan: #00F5FF; 
            --neon-green: #00FF88; --light-bg: #f4f7fe; --silver: #64748b; 
        }
        
        * { box-sizing: border-box; }
        body { font-family: 'Sora', sans-serif; background: var(--light-bg); margin: 0; padding-top: 80px; min-height: 100vh; }
        
        .standalone-header {
            position: fixed; top: 0; width: 100%; height: 70px;
            background: #fff; border-bottom: 1px solid #e2e8f0;
            display: flex; align-items: center; padding: 0 40px;
            justify-content: space-between; z-index: 1000;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 30px; }

        /* Filter Bar */
        .filter-bar {
            background: #fff; padding: 25px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); margin-bottom: 30px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px;
        }
        
        .filter-bar select, .filter-bar input {
            padding: 12px 15px; border-radius: 12px; border: 1.5px solid #e2e8f0;
            font-family: 'Sora'; font-size: 13px; outline: none;
        }
        .filter-bar select:focus, .filter-bar input:focus { border-color: var(--electric-blue); }
        
        .btn-filter {
            background: var(--electric-blue); color: white; border: none; border-radius: 12px;
            font-weight: bold; cursor: pointer; padding: 12px;
        }

        /* Question Cards */
        .q-card {
            background: #fff; border-radius: 16px; padding: 25px; margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.02); border: 1px solid #e2e8f0;
            display: flex; flex-direction: column; gap: 15px; position: relative;
        }
        
        .q-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .q-badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge {
            padding: 4px 10px; border-radius: 6px; font-family: 'Space Mono'; font-size: 10px;
            font-weight: bold; text-transform: uppercase;
        }
        .badge-board { background: #f0f7ff; color: var(--electric-blue); }
        .badge-diff-easy { background: #e6fffa; color: #059669; }
        .badge-diff-medium { background: #fffbeb; color: #d97706; }
        .badge-diff-hard { background: #fef2f2; color: #dc2626; }
        .badge-scope { background: var(--midnight); color: var(--cyber-cyan); }
        
        .q-text { font-size: 15px; font-weight: 600; color: var(--midnight); }
        
        .q-actions { position: absolute; top: 25px; right: 25px; display: flex; gap: 10px; }
        .action-btn { background: none; border: none; font-size: 14px; cursor: pointer; color: var(--silver); }
        .action-btn:hover { color: var(--electric-blue); }
        .action-btn.delete:hover { color: #dc2626; }
        
        /* Pagination */
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .page-btn { padding: 8px 15px; border-radius: 8px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; }
        .page-btn.active { background: var(--electric-blue); color: #fff; border-color: var(--electric-blue); }

        .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { background: var(--midnight); color: var(--cyber-cyan); padding: 12px 24px; border-radius: 12px; font-weight: bold; text-decoration: none; font-family: 'Space Mono'; font-size: 12px; }
    </style>
</head>
<body>

<header class="standalone-header">
    <div style="font-weight: 800; font-size: 20px; color: var(--electric-blue);">Q-BANK <span style="color: var(--midnight); font-weight: 400;">| EXPLORER (INSTITUTE)</span></div>
    <button onclick="window.history.back()" style="background: none; border: none; font-family: 'Space Mono'; color: var(--silver); cursor: pointer; font-size: 12px;">
        <i class="fas fa-arrow-left"></i> BACK
    </button>
</header>

<main class="container">
    <div class="top-actions">
        <h2 style="font-weight: 800; color: var(--midnight); margin: 0;">Question Repository</h2>
        <a href="qbank-add.html" class="btn-add">+ ADD NEW QUESTION</a>
    </div>

    <div class="filter-bar" id="filters">
        <select id="board" onchange="loadClasses()"><option value="">All Boards</option></select>
        <select id="classLevel" onchange="loadSubjects()"><option value="">All Classes</option></select>
        <select id="subject" onchange="loadChapters()"><option value="">All Subjects</option></select>
        <select id="chapter" onchange="loadTopics()"><option value="">All Chapters</option></select>
        <select id="topic"><option value="">All Topics</option></select>
        
        <select id="difficulty">
            <option value="">All Difficulties</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>
        
        <select id="scope">
            <option value="both">All Scopes (Global + Institute)</option>
            <option value="global">Global Only</option>
            <option value="institute">Institute Only</option>
        </select>
        
        <input type="text" id="search" placeholder="Search text...">
        
        <button class="btn-filter" onclick="fetchQuestions(1)">APPLY FILTERS</button>
    </div>

    <div id="qList"></div>
    <div class="pagination" id="pagination"></div>
</main>

<script>
    const API_BASE = window.location.origin + '/api/qbank';
    const token = localStorage.getItem("token"); // Institute token

    if (!token) window.location.href = "../login.html";

    const headers = { 'Authorization': \`Bearer \${token}\` };

    async function loadAcademicDropdowns() {
        const res = await fetch(\`\${API_BASE}/academic/boards\`, { headers });
        const data = await res.json();
        const sel = document.getElementById('board');
        if (data.boards) data.boards.forEach(b => sel.innerHTML += \`<option value="\${b}">\${b}</option>\`);
    }

    async function loadClasses() {
        const board = document.getElementById('board').value;
        const sel = document.getElementById('classLevel');
        sel.innerHTML = '<option value="">All Classes</option>';
        if(!board) return;
        const res = await fetch(\`\${API_BASE}/academic/classes?board=\${board}\`, { headers });
        const data = await res.json();
        if (data.classes) data.classes.forEach(c => sel.innerHTML += \`<option value="\${c}">\${c}</option>\`);
    }
    async function loadSubjects() {
        const board = document.getElementById('board').value;
        const classLvl = document.getElementById('classLevel').value;
        const sel = document.getElementById('subject');
        sel.innerHTML = '<option value="">All Subjects</option>';
        if(!classLvl) return;
        const res = await fetch(\`\${API_BASE}/academic/subjects?board=\${board}&classLevel=\${classLvl}\`, { headers });
        const data = await res.json();
        if (data.subjects) data.subjects.forEach(c => sel.innerHTML += \`<option value="\${c}">\${c}</option>\`);
    }
    async function loadChapters() {
        const board = document.getElementById('board').value;
        const classLvl = document.getElementById('classLevel').value;
        const subj = document.getElementById('subject').value;
        const sel = document.getElementById('chapter');
        sel.innerHTML = '<option value="">All Chapters</option>';
        if(!subj) return;
        const res = await fetch(\`\${API_BASE}/academic/chapters?board=\${board}&classLevel=\${classLvl}&subject=\${subj}\`, { headers });
        const data = await res.json();
        if (data.chapters) data.chapters.forEach(c => sel.innerHTML += \`<option value="\${c}">\${c}</option>\`);
    }
    async function loadTopics() {
        const board = document.getElementById('board').value;
        const classLvl = document.getElementById('classLevel').value;
        const subj = document.getElementById('subject').value;
        const chap = document.getElementById('chapter').value;
        const sel = document.getElementById('topic');
        sel.innerHTML = '<option value="">All Topics</option>';
        if(!chap) return;
        const res = await fetch(\`\${API_BASE}/academic/topics?board=\${board}&classLevel=\${classLvl}&subject=\${subj}&chapter=\${chap}\`, { headers });
        const data = await res.json();
        if (data.topics) data.topics.forEach(c => sel.innerHTML += \`<option value="\${c}">\${c}</option>\`);
    }

    async function fetchQuestions(page = 1) {
        const qParams = new URLSearchParams({
            board: document.getElementById('board').value,
            classLevel: document.getElementById('classLevel').value,
            subject: document.getElementById('subject').value,
            chapter: document.getElementById('chapter').value,
            topic: document.getElementById('topic').value,
            difficulty: document.getElementById('difficulty').value,
            scope: document.getElementById('scope').value,
            search: document.getElementById('search').value,
            page: page,
            limit: 10
        });

        const res = await fetch(\`\${API_BASE}/questions?\${qParams.toString()}\`, { headers });
        const data = await res.json();
        
        const qList = document.getElementById('qList');
        const pagination = document.getElementById('pagination');
        
        if (data.success) {
            qList.innerHTML = data.questions.map(q => \`
                <div class="q-card">
                    <div class="q-header">
                        <div class="q-badges">
                            <span class="badge badge-board">\${q.board} • \${q.class_level} • \${q.subject}</span>
                            <span class="badge badge-board">\${q.chapter} &gt; \${q.topic}</span>
                            <span class="badge badge-diff-\${q.difficulty}">\${q.difficulty}</span>
                            <span class="badge badge-scope">\${q.scope}</span>
                            <span class="badge" style="background:#e2e8f0;color:#475569">\${q.marks}M / -\${q.negative_marks}M</span>
                        </div>
                        <div class="q-actions">
                            \${q.scope === 'institute' ? \`<button class="action-btn delete" onclick="deleteQ('\${q.question_uuid}')"><i class="fas fa-trash"></i></button>\` : ''}
                        </div>
                    </div>
                    <div class="q-text">\${q.question_text}</div>
                </div>
            \`).join('');

            // Simple Pagination
            let pHTML = '';
            for(let i=1; i<=data.pagination.totalPages; i++) {
                pHTML += \`<button class="page-btn \${i===page?'active':''}" onclick="fetchQuestions(\${i})">\${i}</button>\`;
            }
            pagination.innerHTML = pHTML;
        }
    }

    async function deleteQ(uuid) {
        if(!confirm("Are you sure you want to delete this question?")) return;
        const res = await fetch(\`\${API_BASE}/questions/\${uuid}\`, { method: 'DELETE', headers });
        const data = await res.json();
        if(data.success) fetchQuestions(1);
        else alert(data.message);
    }

    loadAcademicDropdowns();
    fetchQuestions(1);
</script>
</body>
</html>
