<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Chapter Units | TestSeries Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --midnight: #0A0E27; --electric-blue: #0066FF; --neon-green: #00FF88; --rose: #e11d48; }
        body { font-family: 'Sora', sans-serif; background: #f4f7fe; padding-top: 130px; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px 100px; }
        
        .q-card { 
            background: #fff; padding: 30px; border-radius: 20px; border: 1px solid #e2e8f0; 
            margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .q-text { font-size: 16px; font-weight: 700; color: var(--midnight); line-height: 1.6; margin-bottom: 20px; display: block; }
        
        .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .opt { padding: 12px 15px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 13px; }
        .opt.correct { background: #f0fdf4; border-color: #86efac; color: #166534; font-weight: 800; }
        
        .meta-bar { 
            margin-top: 20px; padding-top: 15px; border-top: 1.5px solid #f1f5f9; 
            display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="header-container"></div>

    <main class="container">
        <div style="margin-bottom: 35px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <a href="manage-chapters.html" style="text-decoration:none; color:var(--silver); font-family:'Space Mono'; font-size:12px;">
                    <i class="fas fa-arrow-left"></i> BACK_TO_BANK
                </a>
                <h2 id="chapTitle" style="font-weight: 800; margin-top: 10px;">Unit Inspector</h2>
            </div>
        </div>

        <div id="questionsList">
            <p style="text-align:center; font-family:'Space Mono'; color:var(--silver);">FETCHING_UNITS...</p>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    
<script src="../config.js"></script>
<script src="layout.js"></script>

    <script>
        /* ================= STANDALONE CONFIG ================= */
        const BASE_URL = ""; // Change to domain if API is on subdomain
        const token = localStorage.getItem("token");
        const params = new URLSearchParams(window.location.search);
        const chapterId = params.get("chapterId");
        const name = params.get("name");

        if (!token) window.location.href = "../login.html";
        document.getElementById("chapTitle").innerText = name || "Loading...";

       async function loadQuestions() {
            try {
                const res = await fetch(BASE_URL + `/api/teacher/get-chapter-questions/${chapterId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const list = document.getElementById("questionsList");

                if(!data.questions || data.questions.length === 0) {
                    list.innerHTML = `<div style="text-align:center; padding:100px; color:var(--silver);">EMPTY_CHAPTER_REPOSITORY</div>`;
                    return;
                }

                list.innerHTML = data.questions.map((q, index) => {
                    // Check if image exists and is a valid base64 or URL
                    const imageHtml = q.image_url 
                        ? `<div class="q-image-container" style="margin: 15px 0; width: 100%;height: 300px">
                            <img src="${q.image_url}" alt="Question Image" style="width: 100%; height: 100%; border-radius: 8px; border: 1px solid #e2e8f0;">
                        </div>` 
                        : '';

                    return `
                        <div class="q-card">
                            <span class="q-text">${index + 1}. ${q.question_text}</span>
                            
                            ${imageHtml}

                            <div class="opt-grid">
                                <div class="opt ${q.correct_option === 'A' ? 'correct' : ''}"><b>A:</b> ${q.option_a}</div>
                                <div class="opt ${q.correct_option === 'B' ? 'correct' : ''}"><b>B:</b> ${q.option_b}</div>
                                <div class="opt ${q.correct_option === 'C' ? 'correct' : ''}"><b>C:</b> ${q.option_c}</div>
                                <div class="opt ${q.correct_option === 'D' ? 'correct' : ''}"><b>D:</b> ${q.option_d}</div>
                            </div>

                            ${q.explanation ? `<div style="margin-top:10px; font-size:12px; color:#64748b; font-style:italic;"><b>Expl:</b> ${q.explanation}</div>` : ''}

                            <div class="meta-bar" style="margin-top:15px; border-top:1px solid #f1f5f9; pt:10px;">
                                <span style="font-family:'Space Mono'; font-size:11px; color:var(--silver);">TYPE: ${q.q_type ? q.q_type.toUpperCase() : 'SINGLE'}</span>
                                <button onclick="deleteQuestion(${q.id})" style="background:none; border:none; color:var(--rose); cursor:pointer; font-weight:800; font-size:11px;">
                                    <i class="fas fa-trash"></i> PURGE UNIT
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) { 
                console.error(err); 
                document.getElementById("questionsList").innerHTML = `<p style="text-align:center; color:red;">UPLINK_FAILURE</p>`;
            }
        }

        async function deleteQuestion(id) {
            if(!confirm("Purge this intelligence unit from the chapter bank?")) return;
            
            try {
                const res = await fetch(BASE_URL + `/api/teacher/delete-chapter-question/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await res.json();
                if(result.success) loadQuestions();
            } catch (err) {
                alert("Deletion failed.");
            }
        }

        window.onload = loadQuestions;
    </script>
</body>
</html>
