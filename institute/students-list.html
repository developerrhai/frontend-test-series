<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory | TestSeries Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .directory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 20px;
        }

        .search-container { position: relative; width: 350px; }
        .search-container input {
            width: 100%; padding: 12px 45px 12px 20px; border-radius: 12px;
            border: 1.5px solid #e2e8f0; font-family: var(--font-display);
            font-size: 14px; outline: none; transition: 0.3s;
        }
        .search-container input:focus { border-color: var(--electric-blue); box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.08); }
        .search-container i { position: absolute; right: 15px; top: 15px; color: var(--silver); }

        .st-id-badge {
            font-family: var(--font-mono); background: #fdf2ff; color: var(--deep-purple);
            padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 12px;
            border: 1px solid #fae8ff; display: inline-block;
        }

        .view-btn {
            background: var(--electric-blue); color: #fff; padding: 10px 20px;
            border-radius: 10px; border: none; font-weight: 800; font-size: 11px;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .view-btn:hover { background: var(--midnight); transform: translateY(-2px); }
        
        #loadingState { text-align: center; padding: 80px 0; color: var(--silver); width: 100%; }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<main class="dashboard-wrapper">
    <div class="container">
        <section class="dashboard">
            <div class="directory-header">
                <div>
                    <h2 style="font-size: 28px; font-weight: 800; color: #1e3a8a;">Student Roster</h2>
                    <p style="font-family: var(--font-mono); font-size: 11px; color: var(--silver); text-transform: uppercase;">Registry of Neural Access Profiles</p>
                </div>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search ID or Gmail..." onkeyup="filterRoster()">
                    <i class="fas fa-search"></i>
                </div>
            </div>

            <div id="loadingState">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 15px; font-family: var(--font-mono);">SYNCHRONIZING SECURE DATABASE...</p>
            </div>

            <div id="noResults" style="display:none; text-align: center; padding: 80px 0; color: var(--silver);">
                <i class="fas fa-user-slash fa-3x" style="margin-bottom: 15px;"></i>
                <p style="font-family: var(--font-mono);">NO MATCHING RECORDS FOUND</p>
            </div>

            <div class="table-responsive" id="tableContainer" style="display: none;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead style="background: #f8fafc; border-bottom: 2px solid #e2e8f0;">
                        <tr>
                            <th style="padding: 15px 20px; font-family: var(--font-mono); font-size: 10px; color: var(--electric-blue); text-transform: uppercase;">Neural ID</th>
                            <th style="padding: 15px 20px; font-family: var(--font-mono); font-size: 10px; color: var(--electric-blue); text-transform: uppercase;">Identity Link</th>
                            <th style="padding: 15px 20px; font-family: var(--font-mono); font-size: 10px; color: var(--electric-blue); text-transform: uppercase;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentBody">
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<div id="footer-placeholder"></div>


<script src="../config.js"></script>
<script src="layout.js"></script>

<script>
    // Standalone Config Variable
    const BASE_URL = ""; // Change this to your domain if the API is hosted elsewhere
    const token = localStorage.getItem("token");

    if (!token) { window.location.href = "../login.html"; }

    let fullStudentList = [];

    async function loadData() {
        const loading = document.getElementById("loadingState");
        const container = document.getElementById("tableContainer");
        const empty = document.getElementById("noResults");
        
        // Direct fetch call without getUrl dependency
        const apiUrl = BASE_URL + "/api/teacher/linked-students";
        
        try {
            const response = await fetch(apiUrl, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await response.json();
            loading.style.display = "none";

            if (data.success && data.students && data.students.length > 0) {
                fullStudentList = data.students;
                container.style.display = "block";
                renderRoster(fullStudentList);
            } else {
                empty.style.display = "block";
            }
        } catch (err) { 
            console.error("Link Error:", err);
            loading.innerHTML = `<div style="color:#ef4444; font-weight:800;"><i class="fas fa-wifi-slash fa-2x"></i><br>UPLINK ERROR</div>`;
        }
    }

    function renderRoster(list) {
        const body = document.getElementById("studentBody");
        body.innerHTML = list.map(s => `
            <tr>
                <td style="padding: 18px 20px;"><span class="st-id-badge">${s.id}</span></td>
                <td style="padding: 18px 20px;">
                    <div style="font-weight: 800; color: #1e3a8a;">${s.full_name}</div>
                    <div style="font-size: 11px; color: var(--silver); font-family: var(--font-mono);">${s.email}</div>
                </td>
                <td style="padding: 18px 20px;"><button class="view-btn" onclick="window.location.href='view-student.html?id=${s.id}'">Open Intel</button></td>
            </tr>`).join('');
    }

    function filterRoster() {
        const term = document.getElementById("searchInput").value.toLowerCase().trim();
        const filtered = fullStudentList.filter(s => 
            (s.id || "").toLowerCase().includes(term) || (s.email || "").toLowerCase().includes(term)
        );
        renderRoster(filtered);
    }

    loadData();
</script>
</body>
</html>
