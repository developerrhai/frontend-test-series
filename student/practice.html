<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Mode | TestSeries</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ================= GLOBAL STYLES ================= */
        body { margin: 0; font-family: 'Sora', sans-serif; background: #f4f7fe; padding-top: 80px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 25px; background: #050f32; color: #fff; position: fixed; top: 0; width: 100%; box-sizing: border-box; z-index: 1000;}
        .student-info { display: flex; align-items: center; gap: 12px; }
        .student-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; }
        .mode-badge { font-size: 14px; font-weight: bold; background: #16a34a; padding: 5px 15px; border-radius: 6px; font-family: 'Space Mono', monospace;}

        /* ================= LAYOUT ================= */
        .exam-container { display: flex; gap: 20px; padding: 20px; max-width: 1300px; margin: 0 auto; height: calc(100vh - 120px); }
        .question-section { flex: 3; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow-y: auto; }
        .palette-section { flex: 1; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow-y: auto; max-height: 100%;}

        /* ================= QUESTION UI ================= */
        .q-header { font-size: 1.4rem; color: #1e3a8a; border-bottom: 2px solid #eff6ff; padding-bottom: 10px; margin-bottom: 20px; font-weight: 800;}
        #qImage { display: none; max-width: 100%; max-height: 300px; margin: 20px 0; border-radius: 8px; border: 1px solid #e2e8f0; }
        .options-grid { display: grid; gap: 15px; margin-top: 20px; }
        .option-item { display: flex; align-items: center; gap: 15px; padding: 15px; border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: 0.2s; font-family: 'Segoe UI', sans-serif;}
        .option-item:hover { border-color: #3b82f6; background: #f8faff; }
        
        /* Practice Mode Specifics */
        .option-item.selected { border-color: #2563eb; background: #eff6ff; font-weight: bold; }
        .option-item.correct { border-color: #16a34a; background: #dcfce7; font-weight: bold; }
        .option-item.incorrect { border-color: #dc2626; background: #fee2e2; font-weight: bold; }
        
        .explanation-box { margin-top: 25px; padding: 20px; background: #f8fafc; border-left: 4px solid #3b82f6; border-radius: 4px; display: none; }
        .explanation-box h4 { margin-top: 0; color: #1e40af; font-family: 'Space Mono', monospace; font-size: 14px;}
        
        .btn-check { padding:12px 25px; background:#10b981; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; font-family: 'Space Mono', monospace; }
        .btn-nav { padding:12px 25px; background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; font-family: 'Space Mono', monospace; }
        .btn-nav:disabled { background: #94a3b8; cursor: not-allowed; }

        /* ================= PALETTE ================= */
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .q-dot { width: 40px; height: 40px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-family: 'Space Mono', monospace;}
        .q-dot.unattempted { background: #f1f5f9; color: #475569; }
        .q-dot.correct { background: #dcfce7; color: #166534; }
        .q-dot.incorrect { background: #fee2e2; color: #991b1b; }
        .q-dot.current { border: 3px solid #1e40af; box-shadow: 0 0 10px rgba(30,64,175,0.3);}

        @media(max-width: 768px) {
            .exam-container { flex-direction: column; height: auto; }
            .palette-grid { grid-template-columns: repeat(8, 1fr); }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="student-info">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="User">
        <div>
            <div id="sName" style="font-weight:bold">Student Name</div>
            <small id="eTitle">Practice Session</small>
        </div>
    </div>
    <div class="mode-badge">PRACTICE MODE</div>
    <button onclick="exitPractice()" style="padding: 8px 15px; background: transparent; border: 1px solid #fff; color: white; border-radius: 4px; cursor: pointer; font-family: 'Space Mono', monospace;">Exit Practice</button>
</div>

<div class="exam-container" id="examUI">
    <div class="question-section">
        <div class="q-header" id="qNumber">Question 1</div>
        <p id="qText" style="font-size:1.1rem; line-height:1.6;"></p>
        <img id="qImage" alt="Question Diagram">
        <div class="options-grid" id="optContainer"></div>
        
        <div id="explanationBox" class="explanation-box">
            <h4>EXPLANATION</h4>
            <p id="expText">No explanation provided.</p>
        </div>

        <div style="margin-top:30px; display:flex; justify-content: space-between; gap:15px; align-items: center;">
            <button id="prevBtn" onclick="prevQ()" class="btn-nav">Previous</button>
            <button id="checkBtn" onclick="checkAnswer()" class="btn-check">Check Answer</button>
            <button id="nextBtn" onclick="nextQ()" class="btn-nav">Next</button>
        </div>
    </div>

    <div class="palette-section">
        <h4 style="margin-top:0; font-family: 'Space Mono', monospace; font-size: 16px;">Question Palette</h4>
        <div id="palette" class="palette-grid"></div>
    </div>
</div>

<script src="../config.js"></script>
<script>
/* ================= DATA & AUTH ================= */
const user = JSON.parse(localStorage.getItem("currentUser"));
const exam = JSON.parse(localStorage.getItem("currentExam"));
const token = localStorage.getItem("token");

if(!user || !exam || !token) { 
    window.location.href = "question-bank.html"; 
}

document.getElementById("sName").innerText = user.full_name || user.name || "Student";
document.getElementById("eTitle").innerText = exam.title || exam.chapter_name || "Practice Session";

let currentIdx = 0;
// Track state: null (unattempted), { selected: 'A', status: 'correct'/'incorrect' }
let practiceState = new Array(exam.questions.length).fill(null);

function renderQ() {
    const q = exam.questions[currentIdx];
    document.getElementById("qNumber").innerText = `Question ${currentIdx + 1}`;
    document.getElementById("qText").innerText = q.question_text || q.question || "Question content missing";

    const img = document.getElementById("qImage");
    if(q.image_url || q.image) { 
        img.src = q.image_url || q.image; 
        img.style.display = "block"; 
    } else { 
        img.style.display = "none"; 
    }

    const container = document.getElementById("optContainer");
    container.innerHTML = "";
    
    // Hide explanation initially when rendering a question
    const expBox = document.getElementById("explanationBox");
    expBox.style.display = "none";
    
    // Reset check button
    const checkBtn = document.getElementById("checkBtn");
    checkBtn.style.display = "block";

    const rawOpts = q.options || [q.option_a, q.option_b, q.option_c, q.option_d];
    const isNumerical = q.q_type === 'numerical';
    const state = practiceState[currentIdx];

    if (isNumerical) {
        const div = document.createElement("div");
        div.style.padding = "10px";
        const input = document.createElement("input");
        input.type = "number";
        input.id = "numAns";
        input.placeholder = "Enter numerical value";
        input.style.padding = "10px";
        input.style.width = "200px";
        
        if (state) {
            input.value = state.selected;
            input.disabled = true;
            checkBtn.style.display = "none";
            showExplanation(q.correct_option, state.status === 'correct');
        } else {
            input.onchange = (e) => {
                // Temporarily store selected answer in state without marking correct/incorrect yet
                practiceState[currentIdx] = { selected: e.target.value, status: 'pending' };
            };
        }
        div.appendChild(input);
        container.appendChild(div);
    } else {
        rawOpts.forEach((text, i) => {
            const key = ["A", "B", "C", "D"][i];
            const displayText = (text === null || text === undefined || text === "") ? `Option ${key} not provided` : text;

            const div = document.createElement("div");
            div.className = `option-item`;
            
            // Reapply styling if already attempted
            if (state && state.status !== 'pending') {
                if (key === String(q.correct_option).trim()) div.classList.add('correct');
                else if (state.selected === key && state.status === 'incorrect') div.classList.add('incorrect');
                
                div.innerHTML = `<input type="radio" disabled ${state.selected === key ? 'checked' : ''}> <b>${key}.</b> ${displayText}`;
            } else {
                // Pending or Unattempted
                if (state && state.selected === key) div.classList.add('selected');
                
                div.innerHTML = `<input type="radio" name="choice" ${state && state.selected === key ? 'checked' : ''}> <b>${key}.</b> ${displayText}`;
                
                div.onclick = () => {
                    practiceState[currentIdx] = { selected: key, status: 'pending' };
                    // visually update without full re-render
                    document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    div.querySelector('input').checked = true;
                };
            }
            container.appendChild(div);
        });
        
        if (state && state.status !== 'pending') {
            checkBtn.style.display = "none";
            showExplanation(q.correct_option, state.status === 'correct');
        }
    }

    // Nav buttons state
    document.getElementById("prevBtn").disabled = currentIdx === 0;
    document.getElementById("nextBtn").disabled = currentIdx === exam.questions.length - 1;

    updatePalette();
}

function checkAnswer() {
    const state = practiceState[currentIdx];
    if (!state || state.status !== 'pending') {
        alert("Please select an option first!");
        return;
    }

    const q = exam.questions[currentIdx];
    const correctAns = String(q.correct_option).trim();
    const studentAns = String(state.selected).trim();
    
    let isCorrect = false;
    if (q.q_type === 'numerical') {
        isCorrect = parseFloat(studentAns) === parseFloat(correctAns);
    } else {
        isCorrect = studentAns === correctAns;
    }

    practiceState[currentIdx].status = isCorrect ? 'correct' : 'incorrect';
    
    renderQ(); // Re-render to show correct/incorrect styling
}

function showExplanation(correctOption, isCorrect) {
    const expBox = document.getElementById("explanationBox");
    const expText = document.getElementById("expText");
    const q = exam.questions[currentIdx];
    
    expBox.style.display = "block";
    expBox.style.borderLeftColor = isCorrect ? '#16a34a' : '#dc2626';
    
    let html = `<strong>Correct Answer: ${correctOption}</strong><br><br>`;
    html += q.explanation ? q.explanation : "<i>No detailed explanation provided for this question.</i>";
    
    expText.innerHTML = html;
}

function updatePalette() {
    const p = document.getElementById("palette");
    p.innerHTML = "";
    exam.questions.forEach((_, i) => {
        const btn = document.createElement("button");
        btn.innerText = i + 1;
        
        let statusClass = "unattempted";
        if (practiceState[i] && practiceState[i].status === 'correct') statusClass = 'correct';
        else if (practiceState[i] && practiceState[i].status === 'incorrect') statusClass = 'incorrect';
        else if (practiceState[i] && practiceState[i].status === 'pending') statusClass = 'unattempted'; // partially attempted
        
        const currentClass = currentIdx === i ? 'current' : '';
        btn.className = `q-dot ${statusClass} ${currentClass}`;
        
        btn.onclick = () => { currentIdx = i; renderQ(); };
        p.appendChild(btn);
    });
}

function nextQ() {
    if(currentIdx < exam.questions.length - 1) {
        currentIdx++;
        renderQ();
    }
}

function prevQ() {
    if(currentIdx > 0) {
        currentIdx--;
        renderQ();
    }
}

function exitPractice() {
    if(confirm("Exit practice session? Your progress will not be saved.")) {
        localStorage.removeItem("currentExam");
        window.location.href = "question-bank.html";
    }
}

// Initial Render
if(exam && exam.questions && exam.questions.length > 0) {
    renderQ();
} else {
    document.getElementById("examUI").innerHTML = "<h3>No questions found in this set.</h3>";
}
</script>
</body>
</html>
