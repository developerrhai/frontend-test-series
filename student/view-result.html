<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Analysis | Intelligence Hub</title>

    
<script src="../config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #1e3a8a;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --slate: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f4f6fb;
            padding: 20px;
            color: #1e293b;
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Navigation & Actions */
        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            align-items: center;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background: #fff;
            border: 1.5px solid var(--primary);
            color: var(--primary);
        }

        .back-btn:hover {
            background: #f0f4ff;
        }

        .dl-btn {
            background: #059669;
            color: white;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
        }

        .dl-btn:hover {
            background: #047857;
            transform: translateY(-1px);
        }

        /* Summary Section */
        .summary-banner {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: #fff;
            padding: 40px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
        }

        .summary-banner h1 {
            margin: 0;
            font-size: 26px;
        }

        .summary-banner p {
            opacity: 0.9;
            margin-top: 10px;
            font-size: 18px;
        }

        /* Question Cards */
        .q-card {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-left: 8px solid #cbd5e1;
        }

        .q-card.correct {
            border-left-color: var(--success);
        }

        .q-card.wrong {
            border-left-color: var(--danger);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .bg-correct {
            background: #dcfce7;
            color: #166534;
        }

        .bg-wrong {
            background: #fee2e2;
            color: #991b1b;
        }

        .bg-skipped {
            background: #f1f5f9;
            color: #475569;
        }

        .question-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid #e2e8f0;
        }

        /* Options */
        .option {
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            font-size: 15px;
        }

        .student-choice {
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .correct-choice {
            background: #dcfce7 !important;
            border-color: #86efac !important;
            font-weight: bold;
            color: #166534;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            padding: 20px;
            background: #fffbeb;
            border-radius: 12px;
            border: 1px dashed var(--warning);
            line-height: 1.6;
        }

        .explanation-label {
            display: block;
            font-weight: 800;
            color: #b45309;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .analysis-footer {
            margin-top: 15px;
            font-size: 13px;
            color: var(--slate);
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="btn-group">
            <button class="back-btn" onclick="location.href='results.html'"><i class="fas fa-arrow-left"></i> Explorer
                Hub</button>
            <button class="dl-btn" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Download Report</button>
        </div>

        <div id="summary"></div>
        <div id="questionsContainer">
            <div style="text-align:center; padding:50px; color:var(--slate);">Initializing Review Protocol...</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const resultId = urlParams.get('id');
        const token = localStorage.getItem("token");
        let globalData = null;

        async function loadReview() {
            if (!resultId) { window.location.href = 'results.html'; return; }
            try {
                const res = await fetch(`/api/student/result-details/${resultId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                globalData = await res.json();

                if (globalData.success) {
                    renderSummary(globalData.summary);
                    renderQuestions(globalData.questions, globalData.studentAnswers);
                }
            } catch (err) {
                document.getElementById("questionsContainer").innerHTML = "UPLINK_FAILURE: Sync failed.";
            }
        }

        function renderSummary(s) {
            const maxScore = (s.total_questions || 0) * 4;
            document.getElementById("summary").innerHTML = `
            <div class="summary-banner">
                <h1>${s.title}</h1>
                <p>Performance Index: <strong>${s.score}</strong> / ${maxScore}</p>
            </div>
        `;
        }

        function renderQuestions(questions, answers) {
            const container = document.getElementById("questionsContainer");
            container.innerHTML = "";
            const safeAnswers = answers || [];

            questions.forEach((q, index) => {
                const studentChoice = safeAnswers[index];
                const isNotAttempted = (studentChoice === null || studentChoice === undefined || studentChoice === "");
                const isCorrect = studentChoice === q.correct_option;

                const div = document.createElement("div");
                div.className = `q-card ${isCorrect ? 'correct' : (isNotAttempted ? '' : 'wrong')}`;

                div.innerHTML = `
                <span class="status-badge ${isCorrect ? 'bg-correct' : (isNotAttempted ? 'bg-skipped' : 'bg-wrong')}">
                    ${isCorrect ? '<i class="fas fa-check"></i> Correct' : (isNotAttempted ? '<i class="fas fa-minus"></i> Skipped' : '<i class="fas fa-times"></i> Incorrect')}
                </span>
                
                <p style="font-size:17px; font-weight:600;"><strong>Q${index + 1}:</strong> ${q.question_text}</p>
                
                ${q.image_url ? `<img src="${q.image_url}" class="question-img" alt="Diagram">` : ''}
                
                <div class="option ${studentChoice === 'A' ? 'student-choice' : ''} ${q.correct_option === 'A' ? 'correct-choice' : ''}">A: ${q.option_a}</div>
                <div class="option ${studentChoice === 'B' ? 'student-choice' : ''} ${q.correct_option === 'B' ? 'correct-choice' : ''}">B: ${q.option_b}</div>
                <div class="option ${studentChoice === 'C' ? 'student-choice' : ''} ${q.correct_option === 'C' ? 'correct-choice' : ''}">C: ${q.option_c}</div>
                <div class="option ${studentChoice === 'D' ? 'student-choice' : ''} ${q.correct_option === 'D' ? 'correct-choice' : ''}">D: ${q.option_d}</div>
                
                <div class="analysis-footer">
                    <strong>USER_DATA:</strong> ${isNotAttempted ? 'NO_INPUT' : studentChoice} | <strong>SYSTEM_KEY:</strong> ${q.correct_option}
                </div>

                ${q.explanation ? `
                    <div class="explanation-box">
                        <span class="explanation-label"><i class="fas fa-lightbulb"></i> Solution Strategy</span>
                        ${q.explanation}
                    </div>
                ` : ''}
            `;
                container.appendChild(div);
            });
        }

        /* ================= PDF EXPORT LOGIC ================= */
        async function downloadPDF() {
            if (!globalData) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFillColor(30, 58, 138);
            doc.rect(0, 0, 210, 20, "F");
            doc.setTextColor(255);
            doc.setFontSize(14);
            doc.text(`EXAM ANALYSIS: ${globalData.summary.title}`, 105, 13, { align: "center" });

            const tableRows = globalData.questions.map((q, i) => {
                const ans = globalData.studentAnswers[i];
                const isCorrect = ans === q.correct_option;

                // Text Block for PDF
                let content = `Q: ${q.question_text}`;
                if (q.explanation) content += `\n\nLOGIC: ${q.explanation}`;

                return [
                    i + 1,
                    content,
                    q.correct_option,
                    ans || "---",
                    isCorrect ? "PASS" : (ans ? "FAIL" : "SKIP")
                ];
            });

            doc.autoTable({
                startY: 25,
                head: [['#', 'Content & Explanation', 'Key', 'Choice', 'Status']],
                body: tableRows,
                theme: 'striped',
                headStyles: { fillColor: [30, 58, 138], fontSize: 9 },
                styles: { fontSize: 8, cellPadding: 4, overflow: 'linebreak' },
                columnStyles: {
                    1: { cellWidth: 100 },
                    2: { halign: 'center' },
                    3: { halign: 'center' },
                    4: { halign: 'center' }
                }
            });

            doc.save(`Analysis_${globalData.summary.title}.pdf`);
        }

        loadReview();
    </script>
</body>

</html>
