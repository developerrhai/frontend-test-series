<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Online Examination | TestSeries</title>
    <style>
        /* ================= GLOBAL STYLES ================= */
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7fe; overflow: hidden; user-select: none; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 25px; background:#050f32;; color: #fff; }
        .student-info { display: flex; align-items: center; gap: 12px; }
        .student-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; }
        .timer-box { font-size: 20px; font-weight: bold; background: #111827; padding: 5px 15px; border-radius: 6px; }

        /* ================= LAYOUT ================= */
        .exam-container { display: flex; gap: 20px; padding: 20px; visibility: hidden; height: calc(100vh - 80px); }
        .question-section { flex: 3; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow-y: auto; }
        .palette-section { flex: 1; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

        /* ================= QUESTION UI ================= */
        .q-header { font-size: 1.4rem; color: #1e3a8a; border-bottom: 2px solid #eff6ff; padding-bottom: 10px; margin-bottom: 20px; }
        #qImage { display: none; max-width: 100%; max-height: 300px; margin: 20px 0; border-radius: 8px; border: 1px solid #e2e8f0; }
        .options-grid { display: grid; gap: 15px; margin-top: 20px; }
        .option-item { display: flex; align-items: center; gap: 15px; padding: 15px; border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .option-item:hover { border-color: #3b82f6; background: #f8faff; }
        .option-item.selected { border-color: #2563eb; background: #eff6ff; font-weight: bold; }

        /* ================= PALETTE ================= */
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .q-dot { width: 40px; height: 40px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .q-dot.unanswered { background: #fee2e2; color: #991b1b; }
        .q-dot.answered { background: #dcfce7; color: #166534; }
        .q-dot.current { border: 3px solid #1e40af; }

        /* ================= OVERLAYS & PROCTORING ================= */
        #gate { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content:center; text-align: center; }
        #violationOverlay { position: fixed; inset: 0; background: rgba(255,255,255,0.98); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        
        #webcam-thumb {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 120px;
            border-radius: 8px;
            border: 2px solid #1e40af;
            background: #000;
            cursor: move;
            z-index: 9999;
            object-fit: cover;
        }
    </style>
</head>
<body>

<video id="webcam-thumb" autoplay muted playsinline></video>

<div id="gate">
    <h1 style="color:#1e40af">Final Instructions</h1>
    <p>Do not switch tabs or exit fullscreen. Doing so 3 times will terminate the exam.</p>
    <button id="startBtn" style="padding:15px 40px; font-size:1.2rem; background:#16a34a; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">
        Start Secure Examination
    </button>
</div>

<div id="violationOverlay">
    <h2 id="vMsg" style="color:#dc2626">Security Alert!</h2>
    <p>Your session has been paused. Re-enter fullscreen to continue.</p>
    <button id="resumeBtn" style="padding:12px 30px; background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer;">
        Return to Exam
    </button>
</div>

<div class="top-bar">
    <div class="student-info">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="User">
        <div>
            <div id="sName" style="font-weight:bold">Student Name</div>
            <small id="eTitle">Exam Title</small>
        </div>
    </div>
    <div id="timer" class="timer-box">00:00:00</div>
    <div style="font-weight:bold">My Testspot</div>
</div>

<div class="exam-container" id="examUI">
    <div class="question-section">
        <div class="q-header" id="qNumber">Question 1</div>
        <p id="qText" style="font-size:1.1rem; line-height:1.6;"></p>
        <img id="qImage" alt="Question Diagram">
        <div class="options-grid" id="optContainer"></div>

        <div style="margin-top:30px; display:flex; gap:15px;">
            <button onclick="nextQ()" style="padding:12px 25px; background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Save & Next</button>
            <button id="submitBtn" onclick="confirmSubmit()" style="padding:12px 25px; background:#dc2626; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; margin-left:auto;">Submit Exam</button>
        </div>
    </div>

    <div class="palette-section">
        <h4 style="margin-top:0">Question Palette</h4>
        <div id="palette" class="palette-grid"></div>
    </div>
</div>

<script>
/* ================= DATA & AUTH ================= */
const user = JSON.parse(localStorage.getItem("currentUser"));
const exam = JSON.parse(localStorage.getItem("currentExam"));
const token = localStorage.getItem("token");

if(!user || !exam || !token) { window.location.href = "tests.html"; }

document.getElementById("sName").innerText = user.full_name || user.name;
document.getElementById("eTitle").innerText = exam.title;

let currentIdx = 0;
let studentAnswers = new Array(exam.questions.length).fill(null);
let secondsPerQ = new Array(exam.questions.length).fill(0);
let qStartTime = Date.now();
let isExamActive = false;
let warnings = 0;

/* ================= DRAGGABLE WEBCAM ================= */
const webcamBox = document.getElementById("webcam-thumb");
let isDragging = false;
let offsetX = 0;
let offsetY = 0;

webcamBox.addEventListener("mousedown", startDrag);
webcamBox.addEventListener("touchstart", startDrag);

function startDrag(e){
  isDragging = true;
  const rect = webcamBox.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  offsetX = clientX - rect.left;
  offsetY = clientY - rect.top;

  document.addEventListener("mousemove", dragMove);
  document.addEventListener("touchmove", dragMove);
  document.addEventListener("mouseup", stopDrag);
  document.addEventListener("touchend", stopDrag);
}

function dragMove(e){
  if(!isDragging) return;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  webcamBox.style.left = (clientX - offsetX) + "px";
  webcamBox.style.top = (clientY - offsetY) + "px";
  webcamBox.style.bottom = "auto";
  webcamBox.style.right = "auto";
}

function stopDrag(){
  isDragging = false;
  document.removeEventListener("mousemove", dragMove);
  document.removeEventListener("touchmove", dragMove);
  document.removeEventListener("mouseup", stopDrag);
  document.removeEventListener("touchend", stopDrag);
}

/* ================= FULLSCREEN SECURITY ================= */
function triggerFullscreen() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if(req) req.call(el);
}

document.getElementById("startBtn").onclick = triggerFullscreen;
document.getElementById("resumeBtn").onclick = triggerFullscreen;

document.addEventListener("fullscreenchange", () => {
    if (document.fullscreenElement) {
        document.getElementById("gate").style.display = "none";
        document.getElementById("violationOverlay").style.display = "none";
        document.getElementById("examUI").style.visibility = "visible";
        if(!isExamActive) startEngine();
    } else if(isExamActive) {
        handleViolation();
    }
});

function handleViolation() {
    warnings++;
    if(warnings >= 3) {
        alert("Maximum violations reached. Exam submitted automatically.");
        finalSubmit();
    } else {
        document.getElementById("violationOverlay").style.display = "flex";
        document.getElementById("vMsg").innerText = `Violation ${warnings}/3: Fullscreen Exited`;
    }
}

/* ================= EXAM ENGINE ================= */
function startEngine() {
    isExamActive = true;
    startClock();
    renderQ();
    initWebcam();
}

function renderQ() {
    const q = exam.questions[currentIdx];
    document.getElementById("qNumber").innerText = `Question ${currentIdx + 1}`;
    document.getElementById("qText").innerText = q.question_text || q.question || "Question content missing";

    const img = document.getElementById("qImage");
    if(q.image_url || q.image) { 
        img.src = q.image_url || q.image; 
        img.style.display = "block"; 
    } else { 
        img.style.display = "none"; 
    }

    const container = document.getElementById("optContainer");
    container.innerHTML = "";
    
    const rawOpts = q.options || [q.option_a, q.option_b, q.option_c, q.option_d];
    
    rawOpts.forEach((text, i) => {
        const key = ["A", "B", "C", "D"][i];
        const displayText = (text === null || text === undefined || text === "") ? `Option ${key} not provided` : text;

        const div = document.createElement("div");
        div.className = `option-item ${studentAnswers[currentIdx] === key ? 'selected' : ''}`;
        div.innerHTML = `<input type="radio" name="choice" ${studentAnswers[currentIdx] === key ? 'checked' : ''}> ${key}. ${displayText}`;
        
        div.onclick = () => {
            studentAnswers[currentIdx] = key;
            renderQ();
            updatePalette();
        };
        container.appendChild(div);
    });
    qStartTime = Date.now();
    updatePalette();
}

function updatePalette() {
    const p = document.getElementById("palette");
    p.innerHTML = "";
    exam.questions.forEach((_, i) => {
        const btn = document.createElement("button");
        btn.innerText = i + 1;
        btn.className = `q-dot ${studentAnswers[i] ? 'answered' : 'unanswered'} ${currentIdx === i ? 'current' : ''}`;
        btn.onclick = () => { saveProgress(); currentIdx = i; renderQ(); };
        p.appendChild(btn);
    });
}

function saveProgress() {
    const elapsed = Math.floor((Date.now() - qStartTime) / 1000);
    secondsPerQ[currentIdx] += elapsed;
    qStartTime = Date.now();
}

function nextQ() {
    saveProgress();
    if(currentIdx < exam.questions.length - 1) {
        currentIdx++;
        renderQ();
    }
}

function startClock() {
    let totalSeconds = (exam.duration || 60) * 60;
    const timerEl = document.getElementById("timer");
    const interval = setInterval(() => {
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;
        timerEl.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        if(totalSeconds-- <= 0) { clearInterval(interval); finalSubmit(); }
    }, 1000);
}

/* ================= BACKEND SUBMISSION ================= */
function confirmSubmit() {
    if(confirm("Are you sure you want to submit your exam?")) finalSubmit();
}

async function finalSubmit() {
    saveProgress();
    isExamActive = false;
    
    const submitBtn = document.getElementById("submitBtn");
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing Results...";
    }

    const payload = {
        examId: exam.id,
        submittedAnswers: studentAnswers,
        timeSpent: secondsPerQ,
        snapshot: localStorage.getItem("examSnapshot") || null,
        isMock: exam.isMock || false
    };

    try {
        const res = await fetch('/api/student/submit-exam', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}` 
            },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.success) {
            localStorage.removeItem("currentExam");
            localStorage.removeItem("examSnapshot");
            window.location.href = "results.html";
        } else {
            alert("Submission failed: " + data.message);
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Exam";
            }
        }
    } catch (err) {
        alert("Server connection lost. Please try again.");
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = "Retry Submission";
        }
    }
}

async function initWebcam() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        // The ID here MUST match the video tag ID
        document.getElementById("webcam-thumb").srcObject = stream;
    } catch (e) { console.warn("Camera access denied"); }
}

document.addEventListener('contextmenu', e => e.preventDefault());
document.onkeydown = (e) => {
    if(e.ctrlKey || e.key === "F12" || e.key === "Escape") return false;
};
</script>
</body>
</html>
