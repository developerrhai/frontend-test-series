<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription | TestSeries Elite</title>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .dashboard-wrapper { padding: 40px 0 100px; max-width: 1100px; margin: 0 auto; }
        .section-title { text-align: center; margin-bottom: 40px; color: #1e3a8a; font-weight: 800; }

        .plans {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .plan {
            background: var(--pure-white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            text-align: center;
            transition: 0.3s;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .plan:hover { transform: translateY(-5px); border-color: var(--electric-blue); }
        .plan.active-card { border-color: var(--electric-blue); background: #f0f7ff; }

        .price {
            font-size: 38px;
            font-weight: 800;
            margin: 20px 0;
            color: var(--electric-blue);
        }

        .subscribeBtn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--electric-blue), var(--deep-purple));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .subscribeBtn.disabled-btn {
            background: #cbd5e1 !important;
            cursor: not-allowed;
            color: #64748b !important;
        }

        .active-subscription {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border-left: 6px solid var(--electric-blue);
            margin-bottom: 30px;
        }

        .countdown {
            margin-top: 25px;
            font-size: 20px;
            font-weight: 800;
            color: #ef4444;
            background: #fff1f2;
            padding: 12px 24px;
            border-radius: 12px;
        }

        #goToTestsBtn {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 15px;
            background: #10b981;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }

        #goToTestsBtn:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>

<body>


<main class="dashboard-wrapper">
    <h2 class="section-title">Initialize Your Elite Access Plan</h2>

    <div class="plans">

        <!-- 1 MONTH -->
        <div class="plan" id="card-basic">
            <div>
                <h3>1 Month Plan</h3>
                <div class="price">₹499</div>
                <p>
                    <i class="fas fa-check-circle" style="color:#10b981;"></i> Full Test Access<br>
                    <i class="fas fa-check-circle" style="color:#10b981;"></i> Valid for 30 Days
                </p>
            </div>
            <button onclick="subscribe('1 Month Plan', 499, 30)" class="subscribeBtn" id="btn-basic">Subscribe</button>
        </div>

        <!-- 6 MONTH -->
        <div class="plan" id="card-pro">
            <div>
                <h3>6 Month Plan</h3>
                <div class="price">₹749</div>
                <p>
                    <i class="fas fa-check-circle" style="color:#10b981;"></i> Unlimited Examination Access<br>
                    <i class="fas fa-check-circle" style="color:#10b981;"></i> Valid for 180 Days
                </p>
            </div>
            <button onclick="subscribe('6 Month Plan', 749, 180)" class="subscribeBtn" id="btn-pro">Subscribe</button>
        </div>

        <!-- 1 YEAR -->
        <div class="plan" id="card-premium">
            <div>
                <h3>Annual Plan</h3>
                <div class="price">₹999</div>
                <p>
                    <i class="fas fa-check-circle" style="color:#10b981;"></i> All Features Enabled<br>
                    <i class="fas fa-check-circle" style="color:#10b981;"></i> Valid for 365 Days
                </p>
            </div>
            <button onclick="subscribe('Annual Plan', 999, 365)" class="subscribeBtn" id="btn-premium">Subscribe</button>
        </div>

    </div>

    <div class="active-subscription">
        <h3><i class="fas fa-shield-alt"></i> Subscription Protocol Status</h3>
        <p><strong>Plan:</strong> <span id="activePlan">---</span></p>
        <p><strong>Expiry:</strong> <span id="expiryDate">---</span></p>
        <div class="countdown" id="countdownBox">Verifying access token...</div>
    </div>

    <button id="goToTestsBtn" disabled onclick="location.href='tests.html'">
        <i class="fas fa-arrow-circle-right"></i> Access Examination Portal
    </button>
</main>


<script src="../config.js"></script>
<script src="layout.js"></script>

<script>
const token = localStorage.getItem("token");
let user = null;

async function init() {
    if (!token) { location.href = "../login.html"; return; }

    const res = await fetch('/api/auth/profile', {
        headers: { Authorization: `Bearer ${token}` }
    });

    const data = await res.json();
    if (data.success) {
        user = data.user;
        updateUI();
    }
}

function updateUI() {
    const now = new Date();
    const expiry = user.expiry_date ? new Date(user.expiry_date) : null;
    const active = user.plan && expiry && expiry > now;

    document.getElementById("activePlan").innerText = active ? user.plan : "Free Access";
    document.getElementById("expiryDate").innerText = active ? expiry.toLocaleDateString() : "---";

    ["basic","pro","premium"].forEach(p => {
        const btn = document.getElementById(`btn-${p}`);
        btn.disabled = active;
        if(active) btn.classList.add("disabled-btn");
    });

    if(active){
        document.getElementById("goToTestsBtn").disabled = false;
        startCountdown(expiry);
    }
}

function startCountdown(expiry){
    const box = document.getElementById("countdownBox");
    setInterval(() => {
        const diff = expiry - new Date();
        if(diff <= 0){ box.innerText = "Contract Expired"; return; }
        const d = Math.floor(diff / (1000*60*60*24));
        box.innerText = `Access valid for ${d} days`;
    }, 1000);
}

function subscribe(planName, amount, durationDays){
    const expiry = user?.expiry_date ? new Date(user.expiry_date) : null;
    if(user?.plan && expiry && expiry > new Date()){
        alert("Active protocol detected. Upgrade allowed only after expiry.");
        return;
    }

    localStorage.setItem("selectedPlan", JSON.stringify({
        name: planName,
        amount: amount,
        duration: durationDays
    }));

    location.href = "payment.html";
}

init();
</script>

</body>
</html>
