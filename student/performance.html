<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Performance | TestSeries Elite</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        .dashboard-wrapper {
            padding: 40px 0 100px;
        }

        /* --- Performance Page Specific Styles --- */
        #topicSelectContainer {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #topicSelect {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-family: var(--font-display);
            outline: none;
            background: #fff;
        }

        /* Summary Box Redesign */
        #summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-item {
            text-align: center;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .summary-item h3 {
            margin: 0;
            font-size: 0.75rem;
            color: var(--silver);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: var(--font-mono);
        }

        .summary-item span {
            display: block;
            font-size: 2.2rem;
            font-weight: 800;
            margin-top: 5px;
            font-family: var(--font-display);
        }

        #answeredCount { color: #059669; }
        #incorrectCount { color: #dc2626; }
        #totalScore { color: var(--electric-blue); }

        /* Charts Layout */
        .chart-grid { 
            display: grid; 
            grid-template-columns: 1fr 1.5fr; 
            gap: 25px; 
            margin-top: 20px;
        }

        .chart-card { 
            background: #fff; 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid #f1f5f9;
            text-align: center; 
        }

        .chart-card h4 {
            margin-bottom: 20px;
            font-family: var(--font-display);
            color: var(--midnight);
            font-weight: 700;
        }

        canvas { max-width: 100% !important; }

        @media (max-width: 768px) {
            .chart-grid { grid-template-columns: 1fr; }
            #summary { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>


<main class="dashboard-wrapper">
    <section class="dashboard">
        <div id="topicSelectContainer">
            <label for="topicSelect" style="font-weight: 600; font-size: 14px; color: var(--text-dark);">
                Assessment Intelligence:
            </label>
            <select id="topicSelect">
                <option value="Overall">Overall Performance</option>
            </select>
        </div>

        <div id="summary">
            <div class="summary-item">
                <h3>Correct Marks</h3>
                <span id="answeredCount">0</span>
            </div>
            <div class="summary-item">
                <h3>Negative Marks</h3>
                <span id="incorrectCount">0</span>
            </div>
            <div class="summary-item">
                <h3>Net Score</h3>
                <span id="totalScore">0</span>
            </div>
        </div>

        <div class="chart-grid">
            <div class="chart-card">
                <h4>Efficiency</h4>
                <canvas id="overallChart"></canvas>
            </div>
            <div class="chart-card">
                <h4>Score Progression</h4>
                <canvas id="topicChart"></canvas>
            </div>
        </div>
    </section>
</main>

<script src="layout.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // --- AUTH & INITIALIZATION ---
    const user = JSON.parse(localStorage.getItem("currentUser"));
    const token = localStorage.getItem("token");
    if (!token || !user) location.href = "../login.html";

    let pieChart, barChart;
    let globalHistory = [];

    // Note: Mobile Menu logic removed here as it is handled by layout.js

    // --- DATA LOADING ---
    async function loadPerformanceData() {
        try {
            const res = await fetch('/api/student/reports', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();

            if (data.success) {
                globalHistory = data.history;
                populateDropdown();
                renderDashboard("Overall");
            }
        } catch (err) { console.error(err); }
    }

    function renderDashboard(filter) {
        const dataList = filter === "Overall" 
            ? globalHistory 
            : globalHistory.filter(h => h.title === filter);

        let netScore = 0, totalNegativePenalty = 0, totalPositiveMarks = 0;

        dataList.forEach(row => {
            netScore += row.score;
            const totalQ = row.total_questions || 0;
            const estimatedWrong = Math.floor((totalQ*4 - row.score)/5);
            totalNegativePenalty += estimatedWrong;
            totalPositiveMarks += row.score + estimatedWrong;
        });

        document.getElementById("answeredCount").innerText = totalPositiveMarks;
        document.getElementById("totalScore").innerText = netScore;
        document.getElementById("incorrectCount").innerText = totalNegativePenalty > 0 ? `-${totalNegativePenalty}` : "0";

        updateCharts(dataList);
    }

    function updateCharts(dataList) {
        if (!dataList.length) return;

        const labels = dataList.slice(0,10).map(d => d.title.length>15 ? d.title.slice(0,12)+"..." : d.title);
        const scores = dataList.slice(0,10).map(d => d.score);

        if (pieChart) pieChart.destroy();
        pieChart = new Chart(document.getElementById("overallChart"), {
            type: "doughnut",
            data: {
                labels: ["Marks Secured", "Marks Lost"],
                datasets: [{
                    data: [
                        dataList.reduce((a,b)=>a+b.score,0),
                        dataList.reduce((a,b)=>a+(b.total_questions*4-b.score),0)
                    ],
                    backgroundColor: ["#0066FF", "#E2E8F0"],
                    borderWidth: 0
                }]
            },
            options: { cutout: '75%', plugins: { legend: { position: 'bottom' } } }
        });

        if (barChart) barChart.destroy();
        barChart = new Chart(document.getElementById("topicChart"), {
            type: "bar",
            data: {
                labels: labels,
                datasets: [{
                    label: "Net Score",
                    data: scores,
                    backgroundColor: "#6B2FFF",
                    borderRadius: 6
                }]
            },
            options: { 
                scales: { 
                    y: { beginAtZero: true, grid: { display: false } }, 
                    x: { grid: { display: false } } 
                }, 
                plugins: { legend: { display: false } } 
            }
        });
    }

    function populateDropdown() {
        const select = document.getElementById("topicSelect");
        const uniqueTitles = [...new Set(globalHistory.map(h => h.title))];
        select.innerHTML = `<option value="Overall">Overall Performance</option>`;
        uniqueTitles.forEach(title => { 
            const opt=document.createElement("option"); 
            opt.value=title; opt.innerText=title; select.appendChild(opt); 
        });
    }

    document.getElementById("topicSelect").addEventListener("change", e => renderDashboard(e.target.value));

    // --- PDF EXPORT (Logic Unchanged, Style Updated) ---
    function exportPDF() {
        const dashboard = document.querySelector('.dashboard');
        // Temporarily hide the download button so it doesn't appear in the PDF
        btn.style.display = "none";

        html2canvas(dashboard, { scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
            
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(`${user.full_name}_Performance_Report.pdf`);
            
            // Show button again
            btn.style.display = "block";
        });
    }

    // Creating the "Elite" version of your button
    const btn = document.createElement('button');
    btn.innerText = "DOWNLOAD ANALYTICAL REPORT (PDF)";
    // Using your gradient and Elite button style
    btn.style.cssText = `
        display: block;
        margin: 0 auto 30px auto;
        padding: 16px 32px;
        background: linear-gradient(135deg, #0066FF, #6B2FFF);
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 1px;
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
    `;
    
    btn.onmouseover = () => btn.style.transform = "translateY(-2px)";
    btn.onmouseout = () => btn.style.transform = "translateY(0)";
    btn.onclick = exportPDF;
    
    document.querySelector('.dashboard').prepend(btn);

    loadPerformanceData();
});
</script>
</body>
</html>
