<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence Bank Editor | Elite Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --electric-blue: #0066FF;
            --deep-purple: #6B2FFF;
            --cyber-cyan: #00F5FF;
            --midnight: #0A0E27;
            --pure-white: #FFFFFF;
            --light-bg: #f4f7fe;
            --text-dark: #1e293b;
            --silver: #64748b;
            --neon-green: #00FF88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: 'Sora', sans-serif; background: var(--light-bg); padding-top: 150px; min-height: 100vh; display: flex; flex-direction: column; }

        .mini-header { position: fixed; top: 0; width: 100%; background: var(--midnight); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
        .back-link { color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; font-family: 'Space Mono'; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        .test-title { color: var(--cyber-cyan); font-family: 'Space Mono'; font-size: 13px; font-weight: 700; text-transform: uppercase; }

        .container { max-width: 1000px; margin: 0 auto; padding: 30px; flex: 1; text-align: center; }
        .editor-card { background: #fff; padding: 45px; border-radius: 28px; border: 1px solid #e2e8f0; box-shadow: 0 15px 45px rgba(0, 0, 0, 0.05); position: relative; }
        .q-counter-badge { position: absolute; top: -15px; right: 45px; background: var(--midnight); color: var(--neon-green); padding: 8px 20px; border-radius: 12px; font-family: 'Space Mono'; font-weight: 800; border: 2px solid var(--neon-green); }

        .input-group { margin-bottom: 25px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: 800; color: var(--electric-blue); text-transform: uppercase; margin-bottom: 12px; font-family: 'Space Mono'; letter-spacing: 1.5px; }
        textarea, input, select { width: 100%; padding: 18px; border-radius: 14px; border: 2px solid #e2e8f0; background: #f8fafc; font-size: 16px; outline: none; transition: 0.3s; font-family: inherit; }
        textarea:focus, input:focus { border-color: var(--electric-blue); background: #fff; }
        
        .preview-img { max-width: 100%; max-height: 200px; border-radius: 14px; display: none; margin-top: 15px; border: 1px solid #e2e8f0; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .sync-btn { width: 100%; padding: 22px; background: linear-gradient(135deg, var(--electric-blue), var(--deep-purple)); color: white; border: none; border-radius: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; transition: 0.3s; }
        .sync-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(107, 47, 255, 0.3); }
        .sync-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        .q-preview-box { background: #fff; padding: 30px; border-radius: 22px; margin-bottom: 20px; border: 1px solid #e2e8f0; border-left: 8px solid var(--cyber-cyan); position: relative; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 8px; font-family: 'Space Mono'; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-right: 10px; }
        .delete-action { position: absolute; top: 30px; right: 30px; color: #f43f5e; cursor: pointer; font-size: 18px; transition: 0.2s; }
    </style>
</head>

<body>

    <header class="mini-header">
        <a href="view-question-bank.html" class="back-link"><i class="fas fa-chevron-left"></i> Explorer Hub</a>
        <div class="test-title" id="testHeaderTitle">RESOURCES_EDITOR: UPLINK_STANDBY</div>
    </header>

    <main class="container">
        <div style="text-align: center; margin-bottom: 50px;">
            <h2 style="font-weight: 800; color: var(--midnight); font-size: 32px; letter-spacing: -1px;">Intelligence Deployment</h2>
            <p style="font-size: 12px; color: var(--silver); font-family: 'Space Mono'; text-transform: uppercase; margin-top: 10px;">
                Target Repository: <span id="targetIdDisplay" style="color: var(--electric-blue);">--</span>
            </p>
        </div>

        <section class="editor-card">
            <div class="q-counter-badge">UNIT_#<span id="currentQNum">1</span></div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="input-group">
                    <label>Intelligence Mode</label>
                    <select id="qType" onchange="adjustUI()">
                        <option value="single">Single Choice (MCQ)</option>
                        <option value="multiple">Multiple Correct (MSQ)</option>
                        <option value="numerical">Numerical (NAT)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Visual Diagram (Optional)</label>
                    <input type="file" id="qImg" accept="image/*">
                    <img id="imgPreview" class="preview-img">
                </div>
            </div>

            <div class="input-group">
                <label>Question Intelligence (Content)</label>
                <textarea id="qText" rows="3" placeholder="Define the problem..."></textarea>
            </div>

            <div id="optionsWrapper">
                <div class="options-grid">
                    <div class="input-group"><label>Vector A</label><input id="optA" placeholder="Value A"></div>
                    <div class="input-group"><label>Vector B</label><input id="optB" placeholder="Value B"></div>
                    <div class="input-group"><label>Vector C</label><input id="optC" placeholder="Value C"></div>
                    <div class="input-group"><label>Vector D</label><input id="optD" placeholder="Value D"></div>
                </div>
            </div>

            <div class="input-group">
                <label>Solution Vector (Correct Key)</label>
                <div id="ansInputArea">
                    <select id="correctAns">
                        <option value="A">OPTION A</option>
                        <option value="B">OPTION B</option>
                        <option value="C">OPTION C</option>
                        <option value="D">OPTION D</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label style="font-family:'Space Mono'; color:var(--electric-blue); font-size:12px; font-weight:800;">
                    <i class="fas fa-lightbulb"></i> SOLUTION EXPLANATION
                </label>
                <textarea id="explanation" placeholder="Explain the logic..." style="height:120px; margin-top:10px;"></textarea>
            </div>

            <button class="sync-btn" onclick="saveQuestion()" id="mainSyncBtn">
                <i class="fas fa-cloud-upload-alt"></i> Sync to Intelligence Bank
            </button>
        </section>

        <h4 style="margin: 40px 0 20px; text-transform: uppercase; font-family: 'Space Mono'; font-size: 13px; color: var(--silver);">Active Bank Preview</h4>
        <div id="qList"></div>
    </main>

    <footer class="footer">
        <p>© 2026 READYHAND AI | SYSTEM_ADMIN_PROTOCOL</p>
    </footer>

    
<script src="../config.js"></script>
<script>
        const token = localStorage.getItem("token");
        const params = new URLSearchParams(window.location.search);
        const examId = params.get("examId");
        let imageBase64 = null;

        if (!token || !examId) window.location.href = "view-question-bank.html";

        function getAuthHeaders() {
            const cleanToken = token.replace('Bearer ', '').trim();
            return {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${cleanToken}`
            };
        }

        function adjustUI() {
            const type = document.getElementById("qType").value;
            const optGrid = document.getElementById("optionsWrapper");
            const ansArea = document.getElementById("ansInputArea");

            if (type === 'numerical') {
                optGrid.style.display = "none";
                ansArea.innerHTML = `<input type="text" id="correctAns" placeholder="e.g. 10.5" required>`;
            } else if (type === 'multiple') {
                optGrid.style.display = "block";
                ansArea.innerHTML = `<input type="text" id="correctAns" placeholder="e.g. A,C" style="text-transform: uppercase;">`;
            } else {
                optGrid.style.display = "block";
                ansArea.innerHTML = `<select id="correctAns"><option value="A">OPTION A</option><option value="B">OPTION B</option><option value="C">OPTION C</option><option value="D">OPTION D</option></select>`;
            }
        }

        document.getElementById("qImg").onchange = function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = () => {
                    imageBase64 = reader.result;
                    const prev = document.getElementById("imgPreview");
                    prev.src = imageBase64;
                    prev.style.display = "block";
                };
                reader.readAsDataURL(file);
            }
        };

        async function startup() {
            document.getElementById("targetIdDisplay").innerText = examId;
            try {
                // Fetch test metadata
                const res = await fetch(`/api/teacher/test/${examId}`, { headers: getAuthHeaders() });
                const data = await res.json();
                if (data.success) document.getElementById("testHeaderTitle").innerText = "EDITOR: " + (data.test.title || "Untitled").toUpperCase();
                refreshBank();
            } catch (err) { console.error("Initial load failed."); }
        }

        async function refreshBank() {
            const container = document.getElementById("qList");
            try {
                const res = await fetch(`/api/admin/get-questions/${examId}`, { headers: getAuthHeaders() });
                const data = await res.json();
                if (data.success) {
                    document.getElementById("currentQNum").innerText = data.questions.length + 1;
                    container.innerHTML = data.questions.map((q, i) => `
                        <div class="q-preview-box">
                            <span class="badge">${q.q_type}</span>
                            <h6>Q${i + 1}: ${q.question_text}</h6>
                            <div style="font-family:'Space Mono'; color:var(--electric-blue); font-size:11px;">SOLUTION: ${q.correct_option}</div>
                            <i class="fas fa-trash delete-action" onclick="purgeQuestion('${q.id}')"></i>
                        </div>
                    `).join('');
                }
            } catch (err) { container.innerHTML = '<p>Handshake Error.</p>'; }
        }

        async function saveQuestion() {
            const qType = document.getElementById("qType").value;
            const btn = document.getElementById("mainSyncBtn");

            const payload = {
                examId: examId,
                qType: qType,
                questionText: (document.getElementById("qText")?.value || "").trim(),
                optionA: qType === 'numerical' ? "" : (document.getElementById("optA")?.value || ""),
                optionB: qType === 'numerical' ? "" : (document.getElementById("optB")?.value || ""),
                optionC: qType === 'numerical' ? "" : (document.getElementById("optC")?.value || ""),
                optionD: qType === 'numerical' ? "" : (document.getElementById("optD")?.value || ""),
                correctOption: (document.getElementById("correctAns")?.value || "").trim().toUpperCase(),
                explanation: (document.getElementById("explanation")?.value || "").trim(),
                image_base64: imageBase64 || null,
                subject: "Mixed"
            };

            if (!payload.questionText || !payload.correctOption) return alert("Required: Question Text and Key.");

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SYNCING...';

            try {
                const res = await fetch("/api/admin/add-question", {
                    method: "POST",
                    headers: getAuthHeaders(),
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (data.success) {
                    alert("SUCCESS: Unit Synchronized.");
                    document.getElementById("qText").value = "";
                    document.getElementById("explanation").value = "";
                    document.getElementById("imgPreview").style.display = "none";
                    document.getElementById("qImg").value = "";
                    imageBase64 = null;
                    refreshBank();
                } else {
                    alert("Sync Error: " + data.message);
                }
            } catch (err) { alert("UPLINK_FAILURE: Backend unreachable."); }
            finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Sync to Intelligence Bank';
            }
        }

        async function purgeQuestion(id) {
            if (!confirm("PURGE_UNIT?")) return;
            await fetch(`/api/admin/delete-question/${id}`, { method: "DELETE", headers: getAuthHeaders() });
            refreshBank();
        }

        startup();
    </script>
</body>
</html>
