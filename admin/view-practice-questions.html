<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Audit | Elite Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --electric-blue: #0066FF;
            --midnight: #0A0E27;
            --cyber-cyan: #00F5FF;
            --light-bg: #f4f7fe;
            --silver: #64748b;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--light-bg);
            padding-top: 100px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- MINI NAV --- */
        .mini-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--midnight);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .back-link {
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            font-family: 'Space Mono';
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- QUESTION CARDS --- */
        .audit-card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            position: relative;
            transition: 0.3s;
        }

        .audit-card:hover {
            border-color: var(--electric-blue);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .q-meta {
            font-family: 'Space Mono';
            font-size: 10px;
            color: var(--silver);
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
        }

        .q-text {
            font-size: 15px;
            font-weight: 700;
            color: var(--midnight);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options-audit {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .opt-item {
            padding: 12px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            color: var(--midnight);
        }

        .opt-item.correct {
            background: rgba(0, 255, 136, 0.1);
            border-color: #00FF88;
            color: #065f46;
            font-weight: 800;
        }

        /* SOLUTION LOGIC BOX */
        .explanation-audit {
            margin-top: 15px;
            padding: 15px;
            background: #fffdf5;
            border-left: 4px solid var(--warning);
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            color: #92400e;
        }

        .explanation-audit b {
            font-family: 'Space Mono';
            font-size: 11px;
            display: block;
            margin-bottom: 5px;
            color: var(--warning);
        }

        .delete-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .delete-btn:hover {
            transform: scale(1.2);
        }

        .empty-state {
            text-align: center;
            padding: 100px 0;
            color: var(--silver);
        }
    </style>
</head>

<body>

    <header class="mini-header">
        <a href="view-question-bank.html" class="back-link"><i class="fas fa-arrow-left"></i> REPOSITORY HUB</a>
        <div id="testTitleDisplay" style="color:var(--cyber-cyan); font-family:'Space Mono'; font-size:12px; font-weight:700;">AUDIT_MODE: POLLING...</div>
    </header>

    <main class="container">
        <div style="margin-bottom: 40px;">
            <h2 style="font-weight: 800; color: var(--midnight);">Question Bank Audit</h2>
            <p id="subTitle" style="font-size: 11px; color: var(--silver); font-family: 'Space Mono';">SYNCING TO DATABASE VECTOR...</p>
        </div>

        <div id="questionsContainer"></div>
    </main>

    
<script src="../config.js"></script>
<script>
        const token = localStorage.getItem("token");
        const params = new URLSearchParams(window.location.search);
        const examId = params.get("examId");

        if (!token || !examId) window.location.href = "view-question-bank.html";

        async function loadAudit() {
            try {
                // ✅ Using direct root-relative paths for Webuzo Proxy
                const testRes = await fetch(`/api/teacher/test/${examId}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const testData = await testRes.json();
                if (testData.success) {
                    document.getElementById("testTitleDisplay").innerText = "AUDITING: " + testData.test.title.toUpperCase();
                }

                // Fetch Questions
                fetchQuestions();
            } catch (e) { console.error("Neural handshake failed."); }
        }

        async function fetchQuestions() {
            const container = document.getElementById("questionsContainer");
            try {
                // ✅ Relative path targeting the backend on the same domain
                const res = await fetch(`/api/admin/get-questions/${examId}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success && data.questions.length > 0) {
                    document.getElementById("subTitle").innerText = `REPOSITORY_ID: ${examId} | TOTAL_UNITS: ${data.questions.length}`;
                    renderList(data.questions);
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder-open" style="font-size: 40px; margin-bottom: 15px;"></i>
                            <p>Repository is currently empty.</p>
                        </div>`;
                }
            } catch (err) { 
                container.innerHTML = '<p style="color:red; text-align:center;">UPLINK_FAILURE: Neural Link Broken.</p>'; 
            }
        }

        function renderList(questions) {
            const container = document.getElementById("questionsContainer");
            container.innerHTML = questions.map((q, i) => `
                <div class="audit-card">
                    <div class="q-meta">
                        <span>UNIT_POS: ${i + 1}</span>
                        <span>TYPE: ${q.q_type.toUpperCase()}</span>
                        <span>DB_ID: ${q.id}</span>
                    </div>
                    <div class="q-text">${q.question_text}</div>
                    
                    ${q.image_url ? `<img src="${q.image_url}" style="max-width:100%; height:auto; border-radius:10px; margin-bottom:15px;">` : ''}

                    <div class="options-audit">
                        <div class="opt-item ${q.correct_option === 'A' ? 'correct' : ''}">A: ${q.option_a || '---'}</div>
                        <div class="opt-item ${q.correct_option === 'B' ? 'correct' : ''}">B: ${q.option_b || '---'}</div>
                        <div class="opt-item ${q.correct_option === 'C' ? 'correct' : ''}">C: ${q.option_c || '---'}</div>
                        <div class="opt-item ${q.correct_option === 'D' ? 'correct' : ''}">D: ${q.option_d || '---'}</div>
                    </div>

                    ${q.explanation ? `
                        <div class="explanation-audit">
                            <b><i class="fas fa-lightbulb"></i> SOLUTION_STRATEGY</b>
                            ${q.explanation}
                        </div>
                    ` : '<div style="color:red; font-size:10px; font-weight:bold; margin-top:10px;">⚠️ EXPLANATION_NOT_FOUND</div>'}

                    <i class="fas fa-trash-alt delete-btn" onclick="deleteUnit('${q.id}')"></i>
                </div>
            `).join('');
        }

        async function deleteUnit(id) {
            if (!confirm("Confirm permanent purge of this unit?")) return;

            try {
                // ✅ Relative path for delete action
                const res = await fetch(`/api/admin/delete-question/${id}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) fetchQuestions();
            } catch (e) { alert("Purge Protocol Failure."); }
        }

        loadAudit();
    </script>
</body>

</html>
