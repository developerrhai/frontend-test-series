<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank Repository | Elite Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --electric-blue: #0066FF;
            --midnight: #0A0E27;
            --cyber-cyan: #00F5FF;
            --neon-green: #00FF88;
            --light-bg: #f4f7fe;
            --silver: #64748b;
            --danger: #ef4444;
            --purple: #6B2FFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Sora', sans-serif; background: var(--light-bg); padding-top: 110px; min-height: 100vh; }

        /* --- HEADER --- */
        .header { position: fixed; top: 0; left: 0; width: 100%; background: var(--midnight); padding: 20px 50px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15); }
        .header .logo { font-size: 24px; font-weight: 800; color: white; text-decoration: none; letter-spacing: -1px; }
        .header .logo span { color: var(--cyber-cyan); }
        .command-center-link { font-family: 'Space Mono'; font-size: 13px; color: var(--cyber-cyan); text-decoration: none; font-weight: 700; text-transform: uppercase; }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* --- SECTOR NAV --- */
        .sector-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        .sector-btn { background: #fff; color: var(--midnight); border: 2px solid #e2e8f0; padding: 12px 28px; border-radius: 50px; font-family: 'Space Mono'; font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.3s; }
        .sector-btn.active { background: var(--midnight); color: var(--cyber-cyan); border-color: var(--cyber-cyan); transform: scale(1.05); }

        /* --- REPOSITORY GRID --- */
        .repo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 25px; }
        .repo-card { background: #fff; border-radius: 24px; padding: 30px; border: 1px solid #e2e8f0; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); }
        .repo-card h3 { font-size: 14px; font-family: 'Space Mono'; color: var(--electric-blue); text-transform: uppercase; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }

        /* --- ITEM ROWS --- */
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1.5px solid #f1f5f9; }
        .item-row:last-child { border-bottom: none; }
        .item-info h5 { font-size: 15px; color: var(--midnight); font-weight: 800; margin-bottom: 4px; }
        .item-info p { font-size: 11px; color: var(--silver); font-family: 'Space Mono'; font-weight: 700; }

        /* --- TACTICAL BUTTONS --- */
        .btn-group { display: flex; gap: 8px; align-items: center; }
        .action-btn { padding: 8px 14px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-family: 'Space Mono'; transition: 0.2s; border: none; }
        .add-q-btn { background: var(--midnight); color: var(--cyber-cyan); border: 1.5px solid var(--cyber-cyan); }
        .view-q-btn { background: #f8fafc; color: var(--midnight); border: 1.5px solid #e2e8f0; }
        .del-btn { background: #fee2e2; color: var(--danger); border: 1.5px solid #fecaca; }
        .del-btn:hover { background: var(--danger); color: white; }
        .view-pyq-btn { font-size: 11px; font-weight: 800; font-family: 'Space Mono'; border: 2px solid var(--electric-blue); padding: 7px 14px; border-radius: 8px; color: var(--electric-blue); text-decoration: none; }
        .empty-msg { font-size: 12px; font-family: 'Space Mono'; color: var(--silver); padding: 15px 0; }
    </style>
</head>

<body>

    <header class="header">
        <a href="admin-dashboard.html" class="logo">ELITE<span>ADMIN</span></a>
        <a href="admin-dashboard.html" class="command-center-link">COMMAND_CENTER <i class="fas fa-terminal"></i></a>
    </header>

    <div class="container">
        <div class="sector-nav">
            <button class="sector-btn" id="defaultBtn" onclick="loadRepository('JEE Main', this)">JEE MAIN</button>
            <button class="sector-btn" onclick="loadRepository('JEE Advanced', this)">JEE ADVANCED</button>
            <button class="sector-btn" onclick="loadRepository('NEET', this)">NEET</button>
            <button class="sector-btn" onclick="loadRepository('MHTCET', this)">MHTCET</button>
        </div>

        <div class="repo-grid">
            <div class="repo-card">
                <h3><i class="fas fa-brain"></i> Practice Sets</h3>
                <div id="testList"></div>
            </div>
            <div class="repo-card">
                <h3 style="color: var(--purple);"><i class="fas fa-book-open"></i> Chapter Modules</h3>
                <div id="chapterList"></div>
            </div>
            <div class="repo-card">
                <h3 style="color: var(--neon-green);"><i class="fas fa-file-pdf"></i> Resource Bank</h3>
                <div id="pdfList"></div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "../login.html";

        let currentActiveSeries = 'JEE Main';

        function getAuthHeaders() {
            // Ensure token is formatted correctly
            const cleanToken = token.replace('Bearer ', '').trim();
            return { "Authorization": `Bearer ${cleanToken}` };
        }

        async function loadRepository(series, btn) {
            currentActiveSeries = series;
            document.querySelectorAll('.sector-nav .sector-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const testContainer = document.getElementById('testList');
            const chapterContainer = document.getElementById('chapterList');
            const pdfContainer = document.getElementById('pdfList');

            testContainer.innerHTML = '<p class="empty-msg">SYNCING_PRACTICE...</p>';
            chapterContainer.innerHTML = '<p class="empty-msg">SYNCING_CHAPTERS...</p>';
            pdfContainer.innerHTML = '<p class="empty-msg">SYNCING_PDFS...</p>';

            try {
                const encodedSeries = encodeURIComponent(series);

                // Use relative paths: /api/...
                const tRes = await fetch(`/api/admin/get-practice-tests/${encodedSeries}`, {
                    headers: getAuthHeaders()
                });
                const tData = await tRes.json();
                renderPractice(tData.tests, testContainer);

                const cRes = await fetch(`/api/admin/get-chapters?series=${encodedSeries}`, {
                    headers: getAuthHeaders()
                });
                const cData = await cRes.json();
                renderChapters(cData.chapters, chapterContainer);

                const pRes = await fetch(`/api/admin/get-pdfs/${encodedSeries}`, {
                    headers: getAuthHeaders()
                });
                const pData = await pRes.json();
                renderPdfs(pData.pdfs, pdfContainer);

            } catch (e) {
                testContainer.innerHTML = '<p style="color:red; font-family:Space Mono;">UPLINK_FAILURE: CHECK_TOKEN_OR_API</p>';
                console.error("Sync Error:", e);
            }
        }

        function renderPractice(tests, container) {
            if (!tests || tests.length === 0) return container.innerHTML = '<p class="empty-msg">NO_DATA</p>';
            container.innerHTML = tests.map(t => `
                <div class="item-row">
                    <div class="item-info">
                        <h5>${t.title}</h5>
                        <p>ID: ${t.id} | ${t.duration} MINS</p>
                    </div>
                    <div class="btn-group">
                        <button class="action-btn add-q-btn" onclick="location.href='add-practice-questions.html?examId=${t.id}'">ADD</button>
                        <button class="action-btn view-q-btn" onclick="location.href='view-practice-questions.html?examId=${t.id}'">VIEW</button>
                        <button class="action-btn del-btn" onclick="deleteFullTest('${t.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderChapters(chapters, container) {
            if (!chapters || chapters.length === 0) return container.innerHTML = '<p class="empty-msg">NO_MODULES_SYNCED</p>';
            container.innerHTML = chapters.map(c => `
                <div class="item-row">
                    <div class="item-info">
                        <h5>${c.chapter_name}</h5>
                        <p>${c.subject.toUpperCase()} | ID: ${c.id}</p>
                    </div>
                    <div class="btn-group">
                        <button class="action-btn add-q-btn" style="border-color:var(--purple); color:var(--purple);" onclick="location.href='add-chapter-questions.html?chapterId=${c.id}'">ADD</button>
                        <button class="action-btn view-q-btn" onclick="location.href='view-chapter-questions.html?chapterId=${c.id}'">VIEW</button>
                        <button class="action-btn del-btn" onclick="deleteChapter('${c.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderPdfs(pdfs, container) {
            if (!pdfs || pdfs.length === 0) return container.innerHTML = '<p class="empty-msg">RESOURCE_NULL</p>';
            container.innerHTML = pdfs.map(p => `
                <div class="item-row">
                    <div class="item-info">
                        <h5>${p.title}</h5>
                        <p>${new Date(p.created_at).toLocaleDateString().toUpperCase()}</p>
                    </div>
                    <a href="${p.file_path}" target="_blank" class="view-pyq-btn">OPEN_PDF</a>
                </div>
            `).join('');
        }

        async function deleteFullTest(examId) {
            if (!confirm("Delete this Practice Test?")) return;
            const res = await fetch(`/api/admin/delete-practice-test/${examId}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });
            const data = await res.json();
            if (data.success) loadRepository(currentActiveSeries, document.querySelector('.sector-btn.active'));
        }

        async function deleteChapter(chapterId) {
            if (!confirm("Purge this Chapter?")) return;
            try {
                const res = await fetch(`/api/admin/delete-chapter/${chapterId}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                if (data.success) loadRepository(currentActiveSeries, document.querySelector('.sector-btn.active'));
            } catch (e) { alert("Deletion failed."); }
        }

        window.onload = () => {
            const defaultBtn = document.getElementById("defaultBtn");
            loadRepository('JEE Main', defaultBtn);
        };
    </script>
</body>
</html>
